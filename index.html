<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MBrowser</title>
    <link rel="stylesheet" href="apps/browser/Style.css">
</head>
<body>


  <div class="apps-menu" id="appsMenu">
    <div class="app" onclick="openApp('mmail')">📧 MMail</div>
    <div class="app" onclick="openApp('mnote')">📝 MNote</div>
    <div class="app" onclick="openApp('mtube')">📺 MTube</div>
    <div class="app" onclick="openApp('mdrive')">📁 MDrive</div>
    <div class="app" onclick="openApp('mpay')">💵 MPay</div>
    <div class="app" onclick="openApp('mcalculator')">🧮 MCalculator</div>
    <div class="app" onclick="openApp('mcalender')">📅 MCalender</div>
  </div>    
      
  <div class="header">
    <div class="tabs">
      <div class="tab active" onclick="newTab()">New Tab</div>
      <button class="addtab" onclick="newTab()">+</button>
    </div>
    <div class="topbar">
      <button onclick="goBack()">←</button>
      <button onclick="goForward()">→</button>
      <button onclick="refreshPage()">⟳</button>
      
      <input id="url" placeholder="Search Google or Enter URL" onkeypress="if(event.key==='Enter'){loadSite()}">
      
      <button id="bookmarkStarBtn" class="bookmark-star" onclick="Bookmarks.toggleOrEditCurrent()" title="Bookmark this page" aria-label="Bookmark this page">☆</button>
      <button id="bookmarkManagerBtn" onclick="Bookmarks.openManager()" title="Bookmark Manager" aria-label="Bookmark Manager">📑</button>
      <button id="historyManagerBtn" onclick="History.openManager()" title="History" aria-label="History">🕐</button>
    <button id="appsBtn" onclick="toggleApps()">⋮</button>
      <button onclick="loadSite()">Go</button>
    </div>
    <div id="bookmarksBar" class="bookmarks-bar" aria-label="Bookmarks bar">
      <div id="bookmarksBarItems" class="bookmarks-bar-items"></div>
      <button type="button" class="bm-bar-manage" onclick="Bookmarks.openManager()" title="Manage bookmarks">⋯</button>
    </div>
  </div>

  <div id="home" class="home">
    <img src="mbrowser-logo.ico" id="homeLogo">
    <h1>MBrowser</h1>
    <p>Search Anything</p>
    <input id="homesearch" placeholder="Search Google or type a URL" onkeydown="if(event.key==='Enter'){ homeSearch() }">
    <button id="googleBtn" onclick="googleLogin()">Sign in with Google</button>
  </div>

<webview
    id="browser"
    src=""
    preload="file:///C:/Users/L.K. SAMANTA/Desktop/MBrowser/preload.js">
</webview>

<!-- Bookmark Manager -->
<div id="bookmarkManager" class="bm-manager" role="dialog" aria-modal="true" aria-labelledby="bmManagerTitle">
  <div class="bm-manager-panel">
    <div class="bm-manager-header">
      <h2 id="bmManagerTitle">Bookmark Manager</h2>
      <button type="button" class="bm-icon-btn" onclick="Bookmarks.closeManager()" title="Close">✕</button>
    </div>
    <div class="bm-manager-toolbar">
      <input id="bmSearchInput" type="search" placeholder="Search bookmarks" oninput="Bookmarks.onSearchInput(this.value)">
      <button type="button" onclick="Bookmarks.createFolder()">New folder</button>
      <button type="button" id="bmRenameFolderBtn" onclick="Bookmarks.renameSelectedFolder()">Rename folder</button>
      <button type="button" id="bmDeleteFolderBtn" class="danger" onclick="Bookmarks.deleteSelectedFolder()">Delete folder</button>
      <button type="button" onclick="Bookmarks.importHtml()">Import</button>
      <button type="button" onclick="Bookmarks.exportHtml()">Export</button>
    </div>
    <div class="bm-manager-body">
      <aside class="bm-manager-sidebar">
        <div id="bmFolderTree" class="bm-folder-tree"></div>
      </aside>
      <section class="bm-manager-main">
        <h3 id="bmListHeading">Bookmarks bar</h3>
        <div id="bmList" class="bm-list"></div>
      </section>
    </div>
  </div>
</div>

<!-- Add / Edit bookmark dialog -->
<div id="bmFormBackdrop" class="bm-dialog-backdrop">
  <div class="bm-dialog" role="dialog" aria-modal="true">
    <h3 id="bmFormTitle">Add bookmark</h3>
    <label for="bmFormName">Name</label>
    <input id="bmFormName" type="text" autocomplete="off">
    <label for="bmFormUrl">URL</label>
    <input id="bmFormUrl" type="text" autocomplete="off">
    <label for="bmFormFolder">Folder</label>
    <select id="bmFormFolder"></select>
    <div class="bm-dialog-actions">
      <button type="button" id="bmFormDeleteBtn" class="danger" onclick="Bookmarks.deleteBookmarkFromForm()">Delete</button>
      <div class="bm-dialog-spacer"></div>
      <button type="button" onclick="Bookmarks.closeBookmarkFormDialog()">Cancel</button>
      <button type="button" class="primary" onclick="Bookmarks.saveBookmarkForm()">Done</button>
    </div>
  </div>
</div>

<!-- History Manager -->
<div id="historyManager" class="hist-manager" role="dialog" aria-modal="true" aria-labelledby="histManagerTitle">
  <div class="hist-manager-panel">
    <div class="hist-manager-header">
      <h2 id="histManagerTitle">History</h2>
      <button type="button" class="bm-icon-btn" onclick="History.closeManager()" title="Close">✕</button>
    </div>
    <div class="hist-manager-toolbar">
      <input id="histSearchInput" type="search" placeholder="Search history" oninput="History.onSearchInput(this.value)">
      <button type="button" class="danger" onclick="History.deleteSelected()">Delete selected</button>
      <button type="button" class="danger" onclick="History.deleteToday()">Delete today</button>
      <button type="button" class="danger" onclick="History.deleteYesterday()">Delete yesterday</button>
      <button type="button" class="danger" onclick="History.clearAll()">Clear all history</button>
    </div>
    <div class="hist-manager-body">
      <aside class="hist-manager-sidebar">
        <button type="button" class="hist-filter-btn" data-hist-filter="today" onclick="History.setFilter('today')">Today</button>
        <button type="button" class="hist-filter-btn" data-hist-filter="yesterday" onclick="History.setFilter('yesterday')">Yesterday</button>
        <button type="button" class="hist-filter-btn" data-hist-filter="last7" onclick="History.setFilter('last7')">Last 7 Days</button>
        <button type="button" class="hist-filter-btn" data-hist-filter="lastMonth" onclick="History.setFilter('lastMonth')">Last Month</button>
        <button type="button" class="hist-filter-btn active" data-hist-filter="all" onclick="History.setFilter('all')">All History</button>
      </aside>
      <section class="hist-manager-main">
        <div class="hist-list-header">
          <label class="hist-select-all">
            <input id="histSelectAll" type="checkbox" onchange="History.toggleSelectAll(this.checked)">
            Select all
          </label>
          <h3 id="histListHeading">History</h3>
        </div>
        <div id="histList" class="hist-list"></div>
      </section>
    </div>
  </div>
</div>

 <script src="apps/browser/BrowserTab.js"></script>
 <script src="apps/browser/Bookmarks.js"></script>
 <script src="apps/browser/History.js"></script>
 <script src="apps/browser/browser.js"></script>

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.googleLogin = function(){
    const provider = new GoogleAuthProvider();
    
    // ETA JOG KORUN: Eta user-ke account select korar sujog deye
    provider.setCustomParameters({
        prompt: 'select_account'
    });

    signInWithPopup(auth, provider)
    .then((result)=>{ 
        alert("Welcome " + result.user.displayName); 
        console.log("Logged in user email:", result.user.email);
    })
    .catch((error)=>{ alert(error.message); });
}

</script>
</body>
</html>
